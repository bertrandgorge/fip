<!DOCTYPE html>
<html lang="fr">

<head>
  <title>Radio France - Replay & direct</title>
  <meta charset="UTF-8">
  <meta name="title" content="Radio France">


  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Ecouter Fip légèrement !">
  <meta name="keywords" content="replay, radio, Radio France, direct">
  <meta name="author" content="Bertrand Gorge">
  <meta name="theme-color" content="#005DCB">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/png" href="https://www.radiofrance.fr/dist/favicons/radiofrance/favicon.png">
  <link rel="apple-touch-icon" sizes="57x57" href="https://www.radiofrance.fr/dist/favicons/logo-57.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <style>
    body {
      text-align: center;
      color: #353535;
      background-color: #E1E1E1;
      font-size: 15px;
      font-family: "Ubuntu", sans-serif;
      user-select: none;
    }

    button.subrep {
      margin-bottom: 30px;
    }

    h3 {
      color: #161616;
      font-size: 53px;
      margin-bottom: 0px;
      font-family: "Amatic SC", sans-serif;
      font-weight: 700;
    }

    h2 {
      margin: 10px;
      font-size: 25px;
    }

    footer {
      font-size: 10px;
      color: #545454;
      margin-top: 10px;
    }

    button {
      background-color: rgb(0, 93, 203);
      color: #E1E1E1;
      border-radius: 2px;
      padding-left: 40px;
      padding-right: 40px;
      padding-top: 10px;
      padding-bottom: 10px;
      border: none;
      font-size: 18px;
      margin: 10px;
      transition: 0.2s;
    }

    .stationbutton {
      border: 1px solid;
      border-radius: 28px;
      display: inline-block;
      background-color: #B4B4B4;
      color: #353535;
      margin: 6px 4px;
      cursor: pointer;

      padding: 6px 8px;
      font-size: 16px;
      font-weight: 500;
    }

    .fip {
      background-color: #e2007a;
      color: #ffffff;
    }

    .francemusique {
      background-color: #a90042;
      color: #ffffff;
    }

    .franceinter {
      background-color: #e20134;
      color: #ffffff;
    }

    .franceinfo {
      background-color: #ffc300;
      color: #181b1f;
    }

    .franceculture {
      background-color: #722a80;
      color: #ffffff;
    }

    .stationbutton:hover,
    .stationbutton:focus,
    .currently-playing {
      background-color: #002E65;
      color: #B4B4B4;
      cursor: pointer;
    }

    input.vol {
      height: 48px;
      margin: 10px 20px 10px 0;
      width: 195px;
      vertical-align: middle;
    }

    button.play {
      background-size: 48px 48px;
      border-top: 0.5em solid rgba(0, 93, 203, .2);
      border-left: 0.5em solid rgba(0, 93, 203, .2);
      border-bottom: 0.5em solid rgba(0, 93, 203, .2);
      border-right: 0.5em solid #005DCB;
      background-color: transparent;
      padding: 0px;
      height: 48px;
      width: 48px;
      border-radius: 25px;
      margin-left: 20px;
      margin-bottom: 10px;
      animation: rotate 1.1s infinite linear;
      transition: none;
      vertical-align: middle;
    }

    #playdiv {
      display: none;
    }

    #pp {
      background-color: rgb(0, 93, 203);
      border: none;
    }

    div.divpause {
      width: 0px;
      height: 15px;
      margin: auto;
      border-left: 8px solid white;
      border-right: 8px solid white;
      display: inline-block;
      padding: 2.5px;
      border-top: none;
      border-bottom: none;
      background-color: transparent;
    }

    div.divplay {
      display: inline-block;
      background-color: white;
      margin: auto;
      width: 0px;
      height: 0px;
      border-top: 10px solid rgb(0, 93, 203);
      border-bottom: 10px solid rgb(0, 93, 203);
      border-left: 15px solid white;
      border-right: none;
      padding: 0px;
    }

    button.play:hover,
    button.play:focus,
    button.mute:hover,
    button.mute:focus {
      cursor: pointer;
    }

    #mut {
      border: none;
      border-radius: 25px;
      height: 48px;
      width: 48px;
      padding: 0px;
      margin-left: 20px;
      vertical-align: middle;
    }

    .unmuted {
      background-image: url("https://www.francetvinfo.fr/skin/dist/www/img/player-franceinfo/mute-2a46b895c3.png");
    }

    .muted {
      background-image: url("https://www.francetvinfo.fr/skin/dist/www/img/player-franceinfo/unmute-8bfc2f00ea.png");
    }

    video {
      display: none;
    }

    a {
      text-decoration: none;
      color: #353535;
      transition: 0.2s;
    }

    a:hover,
    a:focus {
      text-decoration: none;
      color: #545454;
    }

    google-cast-launcher {
      display: inline-block;
      position: relative;
      width: 31px;
      top: 11px;
    }

    google-cast-launcher:hover {
      --disconnected-color: white;
      --connected-color: white;
    }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #353535;
        color: #B4B4B4;
      }

      h3 {
        color: #D1D1D1;
      }

      footer {
        color: #969696;
      }

      div.img-top {
        background-image: url("https://charte.dnm.radiofrance.fr/images/radiofrance/radio-france-blanc.svg");
      }

      a {
        text-decoration: none;
        color: #B4B4B4;
      }

      a:hover,
      a:focus {
        text-decoration: none;
        color: #969696;
      }

      .liste-radios {
        margin-bottom: 10px;

      }
    }
  </style>
</head>

<body>
  <div id="FipDiv" class="liste-radios"></div>

  <div id="FranceMusiqueDiv" class="liste-radios"></div>

  <div id="FranceInterDiv" class="liste-radios"></div>

  <div onclick="return startTitleInterval(4, true);">
    <h3 id="titl2"> </h3>
    <p><span id="song_title"></span></p>
    <p><span id="song_authors"></span> <span id="song_album"></span> <span id="song_date"></span></p>
  </div>
  <br />
  <div id="cont">
    <video id="lecteur"></video>

    <button class="play" id="pp" onclick="toggleMusic()">
      <div id="playdiv"></div>
    </button>

    <button class="unmuted" onclick="muteClick()" id="mut"></button>
    <input type="range" min="0" max="100" step="1" class="vol" value="100" onclick="vol()" id="son">

    <google-cast-launcher></google-cast-launcher>
  </div>

  <footer style="text-align: right;margin-top: 10px;">
    <a id="debugspan" href="https://github.com/bertrandgorge/Radio-France-replay-direct" target="_blank">Github</a>
  </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script>

  let radiocode = 'fip';
  let titleInterval = null;
  let castInstance = null;

  // Initialize Google Cast
  window['__onGCastApiAvailable'] = function (isAvailable) {
    if (isAvailable) {
      // Add a small delay to ensure cast.framework is fully loaded
      setTimeout(() => {
        if (typeof cast !== 'undefined' && cast.framework) {
          cast.framework.CastContext.getInstance().setOptions({
            receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
          });

          castInstance = cast.framework.CastContext.getInstance();
        } else {
          console.error('Cast framework not available');
        }
      }, 100);
    }
  };

  var hls;
  const radios = new Map();

  radios.set('fip', { 'display': "Fip", 'apiId': "FIP", class: "fip" });
  radios.set('fiprock', { 'display': "Rock", 'apiId': "FIP_ROCK", class: "fip" });
  radios.set('fipjazz', { 'display': "Jazz", 'apiId': "FIP_JAZZ", class: "fip" });
  radios.set('fipgroove', { 'display': "Groove", 'apiId': "FIP_GROOVE", class: "fip" });
  radios.set('fippop', { 'display': "Pop", 'apiId': "FIP_POP", class: "fip" });
  radios.set('fipelectro', { 'display': "Electro", 'apiId': "FIP_ELECTRO", class: "fip" });
  radios.set('fipworld', { 'display': "Monde", 'apiId': "FIP_WORLD", class: "fip" });
  radios.set('fipreggae', { 'display': "Reggae", 'apiId': "FIP_REGGAE", class: "fip" });
  radios.set('fipnouveautes', { 'display': "Nouveautés", 'apiId': "FIP_NOUVEAUTES", class: "fip" });
  radios.set('fipmetal', { 'display': "Métal", 'apiId': "FIP_METAL", class: "fip" });
  radios.set('fiphiphop', { 'display': "Hip-Hop", 'apiId': "FIP_HIP_HOP", class: "fip" });
  radios.set('fipsacrefrancais', { 'display': "Sacré français", 'apiId': "FIP_SACRE_FRANCAIS", class: "fip" });

  radios.set('francemusique', { 'display': "France Musique", 'apiId': "FRANCEMUSIQUE", class: "francemusique" });
  radios.set('francemusiqueeasyclassique', { 'display': "Classique Easy", 'apiId': "FRANCEMUSIQUE_CLASSIQUE_EASY", class: "francemusique" });
  radios.set('francemusiqueclassiquelove', { 'display': "Classique Love", 'apiId': "FRANCEMUSIQUE_CLASSIQUE_LOVE", class: "francemusique" });
  radios.set('francemusiquepianozen', { 'display': "Piano Zen", 'apiId': "FRANCEMUSIQUE_PIANO_ZEN", class: "francemusique" });
  radios.set('francemusiquebaroque', { 'display': "Baroque", 'apiId': "FRANCEMUSIQUE_LA_BAROQUE", class: "francemusique" });
  radios.set('francemusiqueclassiqueplus', { 'display': "Classique Plus", 'apiId': "FRANCEMUSIQUE_CLASSIQUE_PLUS", class: "francemusique" });
  radios.set('francemusiqueconcertsradiofrance', { 'display': "Concerts", 'apiId': "FRANCEMUSIQUE_CONCERT_RF", class: "francemusique" });
  radios.set('francemusiquelajazz', { 'display': "Jazz", 'apiId': "FRANCEMUSIQUE_LA_JAZZ", class: "francemusique" });
  radios.set('francemusiquelacontemporaine', { 'display': "Contemporaine", 'apiId': "FRANCEMUSIQUE_LA_CONTEMPORAINE", class: "francemusique" });
  radios.set('francemusiqueocoramonde', { 'display': "Musiques du Monde", 'apiId': "FRANCEMUSIQUE_OCORA_MONDE", class: "francemusique" });
  radios.set('francemusiquelabo', { 'display': "Films", 'apiId': "FRANCEMUSIQUE_LA_BO", class: "francemusique" });
  radios.set('francemusiqueopera', { 'display': "Opéra", 'apiId': "FRANCEMUSIQUE_OPERA", class: "francemusique" });

  radios.set('franceinter', { 'display': "France Inter", 'apiId': "FRANCEINTER", class: "franceinter" });
  radios.set('franceinfo', { 'display': "France Info", 'apiId': "FRANCEINFO", class: "franceinfo" });
  radios.set('franceculture', { 'display': "France Culture", 'apiId': "FRANCECULTURE", class: "franceculture" });

  function changeRadio(newRadioCode) {
    $("#button_" + radiocode).removeClass("currently-playing");
    $("#button_" + newRadioCode).addClass("currently-playing");
    radiocode = newRadioCode;

    showRadioName();

    playMusic();
    getCurrentTitle();
    return false;
  }

  function playMusic() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null)
      playLocalMusic();
    else
      playChromecastMusic();
  }

  function playLocalMusic() {
    if (radiocode == '')
      return;

    var player = document.getElementById("lecteur");

    var source = "https://stream.radiofrance.fr/" + radiocode + "/" + radiocode + "_hifi.m3u8?id=radiofrance";// _lofi _midfi;

    if (!Hls.isSupported()) {
      player.src = source;
    } else {
      hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(player);
      window.hls = hls;
    }

    player.play()
    //    document.getElementById("cont").style.display = "inline-block";

    showPauseButton();
    vol();
  }

  function playChromecastMusic() {
    if (radiocode == '')
      return;

    var source = "https://icecast.radiofrance.fr/" + radiocode + "-hifi.aac";

    console.log("Casting : " + source);

    var castSession = castInstance.getCurrentSession();

    var mediaInfo = new chrome.cast.media.MediaInfo(source, 'audio/aac');
    var request = new chrome.cast.media.LoadRequest(mediaInfo);
    castSession.loadMedia(request).then(
      function() { 
        console.log('Load succeed'); 
      },
      function(errorCode) { 
        console.log('Error code: ' + errorCode); 
      });
  }

  function showPlayButton() {
    // Affiche le bouton play
    playdiv.classList.add("divplay")
    if (playdiv.classList.contains("divpause") == true) {
      playdiv.classList.remove("divpause");
    }
    playdiv.style.display = "block";
  }

  function showPauseButton() {
    // Affiche le bouton pause
    playdiv.classList.add("divpause");
    if (playdiv.classList.contains("divplay") == true) {
      playdiv.classList.remove("divplay");
    }
    playdiv.style.display = "block";
  }

  function toggleMusic() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null){
      if (isLocalMusicPlaying())
        stopLocalMusic();
      else
        startLocalMusic();
    }
    else {
      stopLocalMusic();

      if (isChromecastPlaying())
        pauseChromecastMusic();
      else
        startChromecastMusic();
    }
  }

  function isLocalMusicPlaying() {
    var player = document.getElementById("lecteur");
    var isPlaying = !!(player.currentTime > 0 && !player.paused && !player.ended && player.readyState > 2);
    return isPlaying;
  }

  function isChromecastPlaying() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null)
      return false;

      let mediaStatus = castSession.getMediaSession();

      console.log("Chromecast player state: " + mediaStatus);
      return mediaStatus != null && mediaStatus.playerState === chrome.cast.media.PlayerState.PLAYING;
  }

  function isMusicPlaying() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null)
      return isLocalMusicPlaying();
    else
      return isChromecastPlaying();
  }

  function stopLocalMusic() {
    var player = document.getElementById("lecteur");
    player.pause();
    player.src = ""; // Force the player to stop downloading data

    showPlayButton();
    clearTitleInterval();
  }

  function startLocalMusic() {
    playLocalMusic();
    showPauseButton();
    startTitleInterval(30);
  }

  function muteClick() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null) {
      var player = document.getElementById("lecteur");
      player.muted = !player.muted;
    }
    else {
      castSession.setMute(!castSession.isMute());
    }

    updateMuteButton();
  }

  function updateMuteButton() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null) {
      var player = document.getElementById("lecteur");

      if (player.muted == true || document.getElementById("son").value == 0) {
        $("#mut").removeClass("unmuted").addClass("muted");
      } else {
        $("#mut").removeClass("muted").addClass("unmuted");
      }
    }
    else {
      if (castSession.isMute() == true) {
        $("#mut").removeClass("unmuted").addClass("muted");
      } else {
        $("#mut").removeClass("muted").addClass("unmuted");
      }
    }
  }

  function vol() {
    var slider = document.getElementById("son");
    setPlayerVolume(slider.value / 100);
    updateMuteButton();

    slider.oninput = function () {
      setPlayerVolume(this.value / 100);
      updateMuteButton();
    }
  }

  function setPlayerVolume(newVol = 1) {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null) {
      var player = document.getElementById("lecteur");
      player.volume = newVol;
    }
    else {
      castSession.setVolume(newVol);
    }
  }

  function startTitleInterval(time, bForce = false) {
    if (bForce)
      clearTitleInterval();
    else if (titleInterval)
      return;

    titleInterval = setTimeout(getCurrentTitle, time * 1000);

    // $("#debugspan").html(titleInterval);
  }

  function clearTitleInterval() {
    clearInterval(titleInterval);
    titleInterval = null;
    // $("#debugspan").html("");
  }

  function getCurrentTitle() {
    titleInterval = null;

    if (!isMusicPlaying()) {
      // Not playing anything
      return;
    }

    var ApiId = radios.get(radiocode).apiId;
    if (ApiId == '') {
      return;
    }

    if (!("mediaSession" in navigator) &&
      document.visibilityState != 'visible') {
      console.log('delaying title update - browser is hidden');
      return;
    }

    $.ajax({
      url: "https://openapi.radiofrance.fr/v1/graphql?x-token=92e33e3e-f6dd-49c7-a8cb-efdbce104fbe",
      method: 'POST',
      dataType: "json",
      contentType: "application/json",
      data: JSON.stringify({
        query: `{
               live(station: ` + ApiId + `)
               {
                  song {
                      id
                      start
                      end
                      track {
                        id
                        title
                        albumTitle
                        authors
                        mainArtists
                        productionDate
                        composers
                      }
                }
              }
            }`}),
      success: function (result) {
        if (result.data.live.song != null) {
          setMetadata(result.data.live.song.track.title,
            result.data.live.song.track.mainArtists + " " + result.data.live.song.track.composers.join(", "),
            result.data.live.song.track.albumTitle,
            result.data.live.song.track.productionDate);

          startTitleInterval(30);
        }
      }
    }).fail(function (jqXHR, textStatus, errorThrown) {

    });
  }

  function showRadioName() {
    let radioName = radios.get(radiocode).display;
    setMetadata(radioName, "", "", "");
    startTitleInterval(4, true);
  }

  function setMetadata(title, authors, album, date) {
    document.getElementById("song_title").innerHTML = title;
    document.getElementById("song_authors").innerHTML = authors;

    if (album.length > 0)
      document.getElementById("song_album").innerHTML = " - " + album;
    else
      document.getElementById("song_album").innerHTML = "";

    document.getElementById("song_date").innerHTML = date;

    // Get the radio name :
    var radioName = "Radio France";
    if (radios.has(radiocode)) {
      radioName = radios.get(radiocode).display;
    }
    document.getElementById("titl2").innerHTML = radioName;

    // change the page title too
    if (title.length > 0)
      document.querySelector("title").innerHTML = authors + " - " + title;
    else
      document.querySelector("title").innerHTML = radioName;

    if ("mediaSession" in navigator) {
      if (title.length == 0)
        title = radioName;

      if (date.length > 0)
        album = album + " (" + date + ")";

      if (title.length == 0)
        title = radioName;

      navigator.mediaSession.metadata = new MediaMetadata(
        {
          title: title,
          artist: authors,
          album: album
        });
    }
  }

  function getArguments() {
    var arg = [];

    var base = window.location.search;
    base = base.slice(1, base.length);
    var tmparguments = base.split("&");
    var k;
    for (k = 0; k < tmparguments.length; k++) {
      var tmpsplit = tmparguments[k].split("=");
      if (arg.length == 0) {
        arg = [tmpsplit[0], tmpsplit[1]];
      } else {
        arg.push(tmpsplit[0]);
        arg.push(tmpsplit[1]);
      }
    }

    var y;
    for (y = 0; y < arg.length; y = y + 2) {
      if (arg[y] == "radio") {
        if (radios.has(arg[y + 1]))
          changeRadio(arg[y + 1]);
        break;
      }
    }
  }

  function setCastIconStatus(newStatus) {
    $("#cast").removeClass("connecting1 connecting2 connecting3 playing enabled disabled").addClass(newStatus);
  }

  function pauseChromecastMusic() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null)
      return;
    let mediaStatus = castSession.getMediaSession();
    if (mediaStatus == null)
      return;
    mediaStatus.pause(null, function () {
      console.log('Paused');
    });
    showPlayButton();

    clearTitleInterval();
  }

  function startChromecastMusic() {
    var castSession = castInstance?.getCurrentSession();
    
    if (castSession == null)
      return;

    let mediaStatus = castSession.getMediaSession();
    if (mediaStatus == null) {
      playChromecastMusic();
      return;
    }
      
    mediaStatus.play(null, function () {
      console.log('Playing'); 
    });

    showPauseButton();

    startTitleInterval(30);
  }

  navigator.mediaSession.setActionHandler('previoustrack', function () {
    let radioCodes = Array.from(radios.keys());
    var found = radioCodes.findIndex((element) => element == radiocode);
    changeRadio(radioCodes.at(found - 1));
  });

  navigator.mediaSession.setActionHandler('nexttrack', function () {
    let radioCodes = Array.from(radios.keys());
    var found = radioCodes.findIndex((element) => element == radiocode);
    if (found == radioCodes.length - 1)
      found = -1;

    changeRadio(radioCodes.at(found + 1));
  });

  navigator.mediaSession.setActionHandler('pause', function () {
    toggleMusic();
  });
  navigator.mediaSession.setActionHandler('play', function () {
    toggleMusic();
  });

  window.onload = function () {
    // Add the buttons
    var fipDiv = document.getElementById("FipDiv");
    var francemusiqueDiv = document.getElementById("FranceMusiqueDiv");
    var franceinterDiv = document.getElementById("FranceInterDiv");

    radios.forEach((value, key) => {
      var button = document.createElement("a");
      button.id = "button_" + key;
      button.className = "stationbutton " + value.class;
      button.onclick = function () { return changeRadio(key); };
      button.innerHTML = value.display;

      if (value.class == "fip") {
        fipDiv.appendChild(button);
      } else if (value.class == "francemusique") {
        francemusiqueDiv.appendChild(button);
      } else {
        franceinterDiv.appendChild(button);
      }
    });

    changeRadio('fip');
    getArguments();
    showPlayButton();

    setTimeout(() => {
      if (isMusicPlaying())
        showPauseButton();
    }, 1000);
    
    startTitleInterval(30);
  };
</script>
